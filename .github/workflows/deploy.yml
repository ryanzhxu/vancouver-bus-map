name: Deploy

# Every merge to main deploys. The gate is not this workflow — main is a
# protected branch that only a pull request with a green `check` run can reach —
# but the suite runs again here anyway, against the merged tree rather than
# against the PR head. A PR can be green in isolation and still break main when
# it lands beside another one, and that is exactly the state we must not ship.

on:
  push:
    branches: [main]
  # Lets you re-run a deploy without an empty commit, e.g. after adding a secret.
  workflow_dispatch:

# Never let two deploys race. Queue them instead of cancelling: a cancelled
# deploy can leave the Worker on an older bundle than main.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install worker deps
        run: npm ci

      - name: Install web deps
        run: npm ci --prefix web

      - name: Typecheck worker
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # `npm run deploy` builds the client and then runs `wrangler deploy`.
      # Wrangler secrets already set on the Worker (TRANSLINK_API_KEY) are not
      # touched by a deploy, so live buses survive every release.
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy

      # Without this the workflow would fail on every merge until the token is
      # added, painting main red for a reason that has nothing to do with the code.
      - name: Skip deploy (no token configured)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set, so this merge did not deploy. Add it under Settings → Secrets and variables → Actions, then re-run this workflow."
