<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint under the notch; CSS uses safe-area insets. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Live map of every bus in Metro Vancouver, built on TransLink open data."
    />
    <title>Vancouver Bus Map</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
